<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection | Modern LUXE Flowers</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:   #0a0a0a;
  --dark:    #111111;
  --surface: #161613;
  --border:  #2a2820;
  --gold:    #c9a96e;
  --gold-dim:#8a7048;
  --cream:   #f5f0e8;
  --body:    #d4cec4;
  --muted:   #a89e90;
}

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Header ---------- */

.page-header {
  padding: 90px 8vw 64px;
  text-align: center;
}

.header-wordmark { display: inline-block; opacity: 0.95; transition: opacity 0.3s ease; }
.header-wordmark:hover { opacity: 1; }
.header-wordmark img { height: 44px; width: auto; margin: 0 auto 30px; }

.header-line {
  font-family: 'EB Garamond', serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(19px, 2vw, 24px);
  color: var(--muted);
  line-height: 1.5;
  max-width: 560px;
  margin: 0 auto;
}

/* ---------- Mosaic grid ---------- */

.mosaic-wrap {
  position: relative;
  padding: 0 4px;
}

.mosaic {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 4px;
}

.mosaic-seams {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.mosaic-seams .seam {
  position: absolute;
  width: 16px;
  transform: translateX(-50%);
}

.tile {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  cursor: zoom-in;
  flex-grow: 0;
  flex-shrink: 0;
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  filter: brightness(0.88) saturate(0.92);
  transition: transform 0.7s ease, filter 0.4s ease;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
  opacity: 0;
}

.tile img.is-loaded { opacity: 1; transition: opacity 0.6s ease, transform 0.7s ease, filter 0.4s ease; }

.tile:hover img {
  transform: scale(1.04);
  filter: brightness(1) saturate(1.05);
}

.tile-small      { flex-basis: 22%; aspect-ratio: 1 / 1; }
.tile-medium     { flex-basis: 34%; aspect-ratio: 4 / 5; }
.tile-large      { flex-basis: 48%; aspect-ratio: 3 / 4; }
.tile-full-bleed { flex-basis: 100%; aspect-ratio: 21 / 9; }

.mosaic-empty {
  text-align: center;
  padding: 60px 8vw 20px;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 17px;
}

/* ---------- Lightbox ---------- */

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.93);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}

#lightbox.open { display: flex; }

.lb-img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  display: block;
  cursor: default;
  -webkit-user-drag: none;
  user-select: none;
}

.lb-close {
  position: absolute;
  top: 20px;
  right: 28px;
  background: none;
  border: none;
  color: var(--cream);
  font-size: 36px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.65;
  transition: opacity 0.2s;
  padding: 4px;
}

.lb-close:hover { opacity: 1; }

.lb-prev, .lb-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--cream);
  font-size: 60px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.2s;
  padding: 8px 20px;
  user-select: none;
}

.lb-prev { left: 12px; }
.lb-next { right: 12px; }
.lb-prev:hover, .lb-next:hover { opacity: 1; }

.lb-counter {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  letter-spacing: 0.12em;
  opacity: 0.55;
}

/* ---------- Closing CTA ---------- */

.cta-band {
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 96px 8vw;
  text-align: center;
  margin-top: 4px;
}

.cta-band p {
  font-family: 'EB Garamond', serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(24px, 3vw, 36px);
  color: var(--cream);
  line-height: 1.3;
  margin-bottom: 34px;
}

.cta-link {
  display: inline-block;
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  text-decoration: none;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--gold-dim);
  transition: border-color 0.3s ease, color 0.3s ease;
}

.cta-link:hover { color: var(--cream); border-color: var(--gold); }

/* ---------- Footer ---------- */

.mini-footer {
  padding: 56px 8vw 64px;
  text-align: center;
}

.footer-wordmark { display: inline-block; opacity: 0.7; transition: opacity 0.3s ease; }
.footer-wordmark:hover { opacity: 1; }
.footer-wordmark img { height: 28px; width: auto; margin: 0 auto; }

/* ---------- Responsive ---------- */

@media (max-width: 1024px) {
  .tile-small  { flex-basis: 30%; }
  .tile-medium { flex-basis: 47%; }
  .tile-large  { flex-basis: 64%; }
  .page-header { padding: 72px 6vw 52px; }
  .cta-band { padding: 76px 6vw; }
}

@media (max-width: 768px) {
  .tile-small, .tile-medium { flex-basis: 47%; }
  .tile-large { flex-basis: 100%; aspect-ratio: 4 / 5; }
  .page-header { padding: 60px 6vw 44px; }
  .header-wordmark img { height: 36px; }
  .cta-band { padding: 66px 6vw; }
}

@media (max-width: 480px) {
  .tile-small, .tile-medium, .tile-large, .tile-full-bleed {
    flex-basis: 100%;
    aspect-ratio: 4 / 5;
  }
  .page-header { padding: 52px 7vw 38px; }
  .header-line { font-size: 17px; }
  .cta-band { padding: 56px 7vw; }
  .cta-band p { margin-bottom: 26px; }
}
</style>
</head>
<body>

<h1 class="sr-only">The Collection — Modern LUXE Flowers</h1>

<!-- HEADER -->
<header class="page-header">
  <a class="header-wordmark" href="/" aria-label="Modern LUXE Flowers home">
    <img src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=768,fit=crop/A85ZREzgQ7sraPkX/rev_1_white-AE0pZjGL43IaRQEr.png" alt="Modern LUXE Flowers">
  </a>
  <p class="header-line">A closer look at recent work — corporate installations, weddings, and gifting, from concept to bloom.</p>
</header>

<!-- MOSAIC GRID -->
<div class="mosaic-wrap">
  <div class="mosaic" id="mosaicGrid"></div>
  <div class="mosaic-seams" id="mosaicSeams"></div>
</div>

<!-- CLOSING CTA -->
<section class="cta-band">
  <p>Every arrangement begins with an introduction.</p>
  <a href="/contact-us-floral-arrangements.html" class="cta-link">Get in Touch</a>
</section>

<!-- MINIMAL FOOTER -->
<footer class="mini-footer">
  <a class="footer-wordmark" href="/" aria-label="Modern LUXE Flowers home">
    <img src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=768,fit=crop/A85ZREzgQ7sraPkX/rev_1_white-AE0pZjGL43IaRQEr.png" alt="Modern LUXE Flowers">
  </a>
</footer>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-label="Image preview">
  <button class="lb-close" aria-label="Close preview">&times;</button>
  <button class="lb-prev" aria-label="Previous image">&#8249;</button>
  <button class="lb-next" aria-label="Next image">&#8250;</button>
  <img class="lb-img" src="" alt="" draggable="false">
  <div class="lb-counter"></div>
</div>

<script>
(function () {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/1abSLqMs2RRdzu_F96TFCjiVbhBI1evOXRPTPH7-t2lE/export?format=csv&gid=0';
  var svgNS = 'http://www.w3.org/2000/svg';
  var grid = document.getElementById('mosaicGrid');
  var seamsLayer = document.getElementById('mosaicSeams');

  function normalizeSize(raw) {
    var v = (raw || '').toString().trim().toLowerCase().replace(/\s+/g, '-');
    if (v === 'full-bleed' || v === 'fullbleed' || v === 'full') return 'full-bleed';
    if (v === 'small' || v === 'medium' || v === 'large') return v;
    return 'medium';
  }

  function isActive(raw) {
    var v = (raw || '').toString().trim().toUpperCase();
    return v === 'TRUE' || v === '1' || v === 'YES' || v === 'Y';
  }

  function cloudinaryUrl(url, width) {
    var marker = '/upload/';
    var idx = url.indexOf(marker);
    if (idx === -1) return url;
    if (/\/upload\/[^/]*\b(f_auto|q_auto)\b/.test(url)) return url;
    return url.slice(0, idx + marker.length) + 'f_auto,q_auto,c_limit,w_' + width + '/' + url.slice(idx + marker.length);
  }

  function parseRows(csvText) {
    var parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    var rows = (parsed.data || []).filter(function (row) {
      return isActive(row['Active']) && (row['Image URL'] || '').toString().trim();
    });
    rows.forEach(function (row) {
      var order = parseFloat(row['Order']);
      row.__order = isNaN(order) ? Infinity : order;
    });
    rows.sort(function (a, b) { return a.__order - b.__order; });
    return rows;
  }

  function buildTile(row, index) {
    var size = normalizeSize(row['Frame Size']);
    var tile = document.createElement('div');
    tile.className = 'tile tile-' + size;

    var img = document.createElement('img');
    img.loading = index < 6 ? 'eager' : 'lazy';
    img.draggable = false;
    img.alt = 'Modern LUXE Flowers';
    img.src = cloudinaryUrl(row['Image URL'].toString().trim(), 900);
    img.dataset.full = cloudinaryUrl(row['Image URL'].toString().trim(), 1800);
    img.addEventListener('load', function () { img.classList.add('is-loaded'); });

    tile.appendChild(img);
    return tile;
  }

  function computeRows() {
    var tiles = Array.from(grid.querySelectorAll('.tile'));
    var rows = [];
    var current = [];
    var currentTop = null;
    tiles.forEach(function (tile) {
      var top = Math.round(tile.getBoundingClientRect().top);
      if (currentTop !== null && Math.abs(top - currentTop) > 2) {
        rows.push(current);
        current = [];
      }
      current.push(tile);
      currentTop = top;
    });
    if (current.length) rows.push(current);
    return rows;
  }

  function buildGutterSVG(height) {
    var h = Math.max(80, Math.round(height));
    var w = 16;
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('aria-hidden', 'true');

    function addLine(x1, y1, x2, y2, opacity, strokeWidth) {
      var line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#c9a96e');
      line.setAttribute('stroke-opacity', opacity);
      line.setAttribute('stroke-width', strokeWidth);
      line.setAttribute('stroke-linecap', 'round');
      svg.appendChild(line);
    }

    addLine(w * 0.28, 6, w * 0.72, 14, 0.5, 1.1);
    addLine(w * 0.72, 6, w * 0.28, 14, 0.5, 1.1);

    var y = 24;
    while (y < h - 24) {
      var jitter = (Math.random() - 0.5) * 10;
      var len = 7 + Math.random() * 4;
      var rot = (Math.random() - 0.5) * 24;
      var cx = w / 2, cy = y + jitter;
      var rad = rot * Math.PI / 180;
      var dx = Math.sin(rad) * (len / 2);
      var dy = Math.cos(rad) * (len / 2);
      addLine(cx - dx, cy - dy, cx + dx, cy + dy, 0.22 + Math.random() * 0.18, 1);
      y += 20 + Math.random() * 12;
    }

    addLine(w * 0.28, h - 14, w * 0.72, h - 6, 0.5, 1.1);
    addLine(w * 0.72, h - 14, w * 0.28, h - 6, 0.5, 1.1);

    return svg;
  }

  function refreshSeams() {
    seamsLayer.innerHTML = '';
    var wrap = document.querySelector('.mosaic-wrap');
    var wrapRect = wrap.getBoundingClientRect();
    var rows = computeRows();

    rows.forEach(function (row) {
      if (row.length < 2) return;
      var sorted = row.slice().sort(function (a, b) {
        return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
      });
      for (var i = 0; i < sorted.length - 1; i++) {
        var rectA = sorted[i].getBoundingClientRect();
        var rectB = sorted[i + 1].getBoundingClientRect();
        var x = ((rectA.right + rectB.left) / 2) - wrapRect.left;
        var top = Math.min(rectA.top, rectB.top) - wrapRect.top;
        var height = Math.min(rectA.height, rectB.height);
        var seam = document.createElement('div');
        seam.className = 'seam';
        seam.style.left = x + 'px';
        seam.style.top = top + 'px';
        seam.appendChild(buildGutterSVG(height));
        seamsLayer.appendChild(seam);
      }
    });
  }

  function render(rows) {
    if (!rows.length) {
      var empty = document.createElement('p');
      empty.className = 'mosaic-empty';
      empty.textContent = 'New work is on its way.';
      grid.parentNode.insertBefore(empty, grid.nextSibling);
      return;
    }

    rows.forEach(function (row, i) { grid.appendChild(buildTile(row, i)); });

    var lbImgs = Array.from(grid.querySelectorAll('.tile img'));

    var lb = document.getElementById('lightbox');
    var lbImg = lb.querySelector('.lb-img');
    var lbClose = lb.querySelector('.lb-close');
    var lbPrev = lb.querySelector('.lb-prev');
    var lbNext = lb.querySelector('.lb-next');
    var lbCounter = lb.querySelector('.lb-counter');
    var currentIdx = 0;

    function showImg(idx) {
      currentIdx = (idx + lbImgs.length) % lbImgs.length;
      var src = lbImgs[currentIdx].dataset.full || lbImgs[currentIdx].src;
      lbImg.src = src;
      lbImg.alt = lbImgs[currentIdx].alt;
      lbCounter.textContent = (currentIdx + 1) + ' / ' + lbImgs.length;
    }

    function openLb(idx) {
      showImg(idx);
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLb() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    grid.querySelectorAll('.tile').forEach(function (el) {
      el.addEventListener('click', function () {
        var img = el.querySelector('img');
        if (!img) return;
        openLb(lbImgs.indexOf(img));
      });
    });

    lbClose.addEventListener('click', closeLb);
    lbPrev.addEventListener('click', function (e) { e.stopPropagation(); showImg(currentIdx - 1); });
    lbNext.addEventListener('click', function (e) { e.stopPropagation(); showImg(currentIdx + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') showImg(currentIdx - 1);
      if (e.key === 'ArrowRight') showImg(currentIdx + 1);
    });

    var touchStartX = 0;
    lb.addEventListener('touchstart', function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) dx < 0 ? showImg(currentIdx + 1) : showImg(currentIdx - 1);
    });

    document.addEventListener('contextmenu', function (e) {
      if (e.target.closest('.mosaic') || e.target.closest('#lightbox')) e.preventDefault();
    });

    requestAnimationFrame(refreshSeams);
    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(refreshSeams, 150);
    });
    window.addEventListener('load', refreshSeams);
  }

  fetch(CSV_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('CSV fetch failed: ' + res.status);
      return res.text();
    })
    .then(function (csvText) { render(parseRows(csvText)); })
    .catch(function (err) {
      console.error('The Collection: could not load content sheet.', err);
      render([]);
    });
})();
</script>

</body>
</html>
