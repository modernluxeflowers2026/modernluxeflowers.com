<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection | Modern LUXE Flowers</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:   #0a0a0a;
  --dark:    #111111;
  --surface: #161613;
  --border:  #2a2820;
  --gold:    #c9a96e;
  --gold-dim:#8a7048;
  --cream:   #f5f0e8;
  --body:    #d4cec4;
  --muted:   #a89e90;
}

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Header ---------- */

.page-header {
  padding: 90px 8vw 64px;
  text-align: center;
}

.header-wordmark { display: inline-block; opacity: 0.95; transition: opacity 0.3s ease; }
.header-wordmark:hover { opacity: 1; }
.header-wordmark img { height: 44px; width: auto; margin: 0 auto 30px; }

.header-line {
  font-family: 'EB Garamond', serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(19px, 2vw, 24px);
  color: var(--muted);
  line-height: 1.5;
  max-width: 560px;
  margin: 0 auto;
}

/* ---------- Shared tile treatment (from Luxe Love / Petals & Stems .cell) ---------- */

.collection-wrap {
  position: relative;
  padding: 0 4px;
}

.tile {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  cursor: zoom-in;
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  filter: brightness(0.88) saturate(0.92);
  transition: transform 0.7s ease, filter 0.4s ease;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
  opacity: 0;
}

.tile img.is-loaded { opacity: 1; transition: opacity 0.6s ease, transform 0.7s ease, filter 0.4s ease; }

.tile:hover img {
  transform: scale(1.04);
  filter: brightness(1) saturate(1.05);
}

.gallery-sep {
  height: 1px;
  background: var(--border);
  margin: 40px 0;
}

/* ---------- Fixed composition A (Luxe Love: hero + split bento + wide-break + bottom-3) ---------- */
/* ---------- Fixed composition B (Petals & Stems: hero + quad bento + bottom-3) ---------- */

.mosaic-main {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 4px;
}

.mosaic-hero { height: 700px; }

.mosaic-bento {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  height: 700px;
}

.mosaic-bento.bento-split { grid-template-rows: 280px 1fr; }
.mosaic-bento.bento-quad  { grid-template-rows: 1fr 1fr; }

.bento-wide { grid-column: span 2; }

.mosaic-wide-break {
  height: 360px;
  margin-top: 4px;
}

.mosaic-bottom {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  margin-top: 4px;
}

.mosaic-bottom .tile { aspect-ratio: 3 / 4; }

/* ---------- Fallback grid for a trailing partial batch (Petals & Stems .mosaic-bottom pattern) ---------- */

.fallback-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.fallback-grid .tile { aspect-ratio: 3 / 4; }

.mosaic-empty {
  text-align: center;
  padding: 60px 8vw 20px;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 17px;
}

/* ---------- Lightbox ---------- */

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.93);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}

#lightbox.open { display: flex; }

.lb-img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  display: block;
  cursor: default;
  -webkit-user-drag: none;
  user-select: none;
}

.lb-close {
  position: absolute;
  top: 20px;
  right: 28px;
  background: none;
  border: none;
  color: var(--cream);
  font-size: 36px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.65;
  transition: opacity 0.2s;
  padding: 4px;
}

.lb-close:hover { opacity: 1; }

.lb-prev, .lb-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--cream);
  font-size: 60px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.2s;
  padding: 8px 20px;
  user-select: none;
}

.lb-prev { left: 12px; }
.lb-next { right: 12px; }
.lb-prev:hover, .lb-next:hover { opacity: 1; }

.lb-counter {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  letter-spacing: 0.12em;
  opacity: 0.55;
}

/* ---------- Closing CTA ---------- */

.cta-band {
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 96px 8vw;
  text-align: center;
  margin-top: 4px;
}

.cta-band p {
  font-family: 'EB Garamond', serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(24px, 3vw, 36px);
  color: var(--cream);
  line-height: 1.3;
  margin-bottom: 34px;
}

.cta-link {
  display: inline-block;
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  text-decoration: none;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--gold-dim);
  transition: border-color 0.3s ease, color 0.3s ease;
}

.cta-link:hover { color: var(--cream); border-color: var(--gold); }

/* ---------- Footer ---------- */

.mini-footer {
  padding: 56px 8vw 64px;
  text-align: center;
}

.footer-wordmark { display: inline-block; opacity: 0.7; transition: opacity 0.3s ease; }
.footer-wordmark:hover { opacity: 1; }
.footer-wordmark img { height: 40px; width: auto; margin: 0 auto; }

/* ---------- Responsive ---------- */

@media (max-width: 1024px) {
  .mosaic-hero { height: 580px; }
  .mosaic-bento { height: 580px; }
  .mosaic-bento.bento-split { grid-template-rows: 240px 1fr; }
  .mosaic-wide-break { height: 300px; }
  .page-header { padding: 72px 6vw 52px; }
  .cta-band { padding: 76px 6vw; }
}

@media (max-width: 768px) {
  .mosaic-main { grid-template-columns: 1fr; }
  .mosaic-hero { height: 480px; }

  .mosaic-bento.bento-split {
    height: auto;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
  .bento-split .bento-wide { height: 280px; }
  .bento-split .tile:not(.bento-wide) { height: 400px; }

  .mosaic-bento.bento-quad {
    height: auto;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .bento-quad .tile { height: 320px; }

  .mosaic-wide-break { height: 260px; }
  .mosaic-bottom { grid-template-columns: 1fr; }
  .fallback-grid { grid-template-columns: 1fr; }

  .page-header { padding: 60px 6vw 44px; }
  .header-wordmark img { height: 36px; }
  .cta-band { padding: 66px 6vw; }
}

@media (max-width: 480px) {
  .page-header { padding: 52px 7vw 38px; }
  .header-line { font-size: 17px; }
  .cta-band { padding: 56px 7vw; }
  .cta-band p { margin-bottom: 26px; }
}
</style>
</head>
<body>

<h1 class="sr-only">The Collection — Modern LUXE Flowers</h1>

<!-- HEADER -->
<header class="page-header">
  <a class="header-wordmark" href="/" aria-label="Modern LUXE Flowers home">
    <img src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=768,fit=crop/A85ZREzgQ7sraPkX/rev_1_white-AE0pZjGL43IaRQEr.png" alt="Modern LUXE Flowers">
  </a>
  <p class="header-line">A closer look at recent work — corporate installations, weddings, and gifting, from concept to bloom.</p>
</header>

<!-- COLLECTION BATCHES -->
<div class="collection-wrap" id="collectionRoot"></div>

<!-- CLOSING CTA -->
<section class="cta-band">
  <p>Every arrangement begins with an introduction.</p>
  <a href="/contact-us-floral-arrangements.html" class="cta-link">Get in Touch</a>
</section>

<!-- MINIMAL FOOTER -->
<footer class="mini-footer">
  <a class="footer-wordmark" href="/" aria-label="Modern LUXE Flowers home">
    <img src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=768,fit=crop/A85ZREzgQ7sraPkX/rev_1_white-AE0pZjGL43IaRQEr.png" alt="Modern LUXE Flowers">
  </a>
</footer>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-label="Image preview">
  <button class="lb-close" aria-label="Close preview">&times;</button>
  <button class="lb-prev" aria-label="Previous image">&#8249;</button>
  <button class="lb-next" aria-label="Next image">&#8250;</button>
  <img class="lb-img" src="" alt="" draggable="false">
  <div class="lb-counter"></div>
</div>

<script>
(function () {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/1abSLqMs2RRdzu_F96TFCjiVbhBI1evOXRPTPH7-t2lE/export?format=csv&gid=0';
  var BATCH_SIZE = 8;
  var root = document.getElementById('collectionRoot');

  function isActive(raw) {
    var v = (raw || '').toString().trim().toUpperCase();
    return v === 'TRUE' || v === '1' || v === 'YES' || v === 'Y';
  }

  function cloudinaryUrl(url, width) {
    var marker = '/upload/';
    var idx = url.indexOf(marker);
    if (idx === -1) return url;
    if (/\/upload\/[^/]*\b(f_auto|q_auto)\b/.test(url)) return url;
    return url.slice(0, idx + marker.length) + 'f_auto,q_auto,c_limit,w_' + width + '/' + url.slice(idx + marker.length);
  }

  function parseRows(csvText) {
    var parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    var rows = (parsed.data || []).filter(function (row) {
      return isActive(row['Active']) && (row['Image URL'] || '').toString().trim();
    });
    rows.forEach(function (row) {
      var order = parseFloat(row['Order']);
      row.__order = isNaN(order) ? Infinity : order;
    });
    rows.sort(function (a, b) { return a.__order - b.__order; });
    return rows;
  }

  function chunk(rows, size) {
    var out = [];
    for (var i = 0; i < rows.length; i += size) out.push(rows.slice(i, i + size));
    return out;
  }

  function buildTileEl(row, globalIndex, extraClass) {
    var tile = document.createElement('div');
    tile.className = 'tile' + (extraClass ? ' ' + extraClass : '');

    var img = document.createElement('img');
    img.loading = globalIndex < 6 ? 'eager' : 'lazy';
    img.draggable = false;
    img.alt = 'Modern LUXE Flowers';
    var url = row['Image URL'].toString().trim();
    img.src = cloudinaryUrl(url, 900);
    img.dataset.full = cloudinaryUrl(url, 1800);
    img.addEventListener('load', function () { img.classList.add('is-loaded'); });

    tile.appendChild(img);
    return tile;
  }

  // Composition A — Luxe Love: hero | bento(wide-top + mid-left + mid-right) / wide-break / bottom x3
  function buildCompositionA(rows, offset) {
    var batch = document.createElement('div');
    batch.className = 'batch';

    var main = document.createElement('div');
    main.className = 'mosaic-main';
    main.appendChild(buildTileEl(rows[0], offset + 0, 'mosaic-hero'));

    var bento = document.createElement('div');
    bento.className = 'mosaic-bento bento-split';
    bento.appendChild(buildTileEl(rows[1], offset + 1, 'bento-wide'));
    bento.appendChild(buildTileEl(rows[2], offset + 2));
    bento.appendChild(buildTileEl(rows[3], offset + 3));
    main.appendChild(bento);
    batch.appendChild(main);

    batch.appendChild(buildTileEl(rows[4], offset + 4, 'mosaic-wide-break'));

    var bottom = document.createElement('div');
    bottom.className = 'mosaic-bottom';
    bottom.appendChild(buildTileEl(rows[5], offset + 5));
    bottom.appendChild(buildTileEl(rows[6], offset + 6));
    bottom.appendChild(buildTileEl(rows[7], offset + 7));
    batch.appendChild(bottom);

    return batch;
  }

  // Composition B — Petals & Stems: hero | bento(2x2 quad) / bottom x3 (no wide-break)
  function buildCompositionB(rows, offset) {
    var batch = document.createElement('div');
    batch.className = 'batch';

    var main = document.createElement('div');
    main.className = 'mosaic-main';
    main.appendChild(buildTileEl(rows[0], offset + 0, 'mosaic-hero'));

    var bento = document.createElement('div');
    bento.className = 'mosaic-bento bento-quad';
    bento.appendChild(buildTileEl(rows[1], offset + 1));
    bento.appendChild(buildTileEl(rows[2], offset + 2));
    bento.appendChild(buildTileEl(rows[3], offset + 3));
    bento.appendChild(buildTileEl(rows[4], offset + 4));
    main.appendChild(bento);
    batch.appendChild(main);

    var bottom = document.createElement('div');
    bottom.className = 'mosaic-bottom';
    bottom.appendChild(buildTileEl(rows[5], offset + 5));
    bottom.appendChild(buildTileEl(rows[6], offset + 6));
    bottom.appendChild(buildTileEl(rows[7], offset + 7));
    batch.appendChild(bottom);

    return batch;
  }

  // Trailing partial batch — uniform 3-column fallback grid
  function buildFallbackGrid(rows, offset) {
    var batch = document.createElement('div');
    batch.className = 'batch';

    var grid = document.createElement('div');
    grid.className = 'fallback-grid';
    rows.forEach(function (row, i) { grid.appendChild(buildTileEl(row, offset + i)); });
    batch.appendChild(grid);

    return batch;
  }

  function render(rows) {
    if (!rows.length) {
      var empty = document.createElement('p');
      empty.className = 'mosaic-empty';
      empty.textContent = 'New work is on its way.';
      root.appendChild(empty);
      return;
    }

    var batches = chunk(rows, BATCH_SIZE);
    var compIndex = 0;
    var offset = 0;

    batches.forEach(function (batchRows) {
      var batchEl;
      if (batchRows.length === BATCH_SIZE) {
        batchEl = (compIndex % 2 === 0) ? buildCompositionA(batchRows, offset) : buildCompositionB(batchRows, offset);
        compIndex++;
      } else {
        batchEl = buildFallbackGrid(batchRows, offset);
      }
      if (root.children.length > 0) {
        var sep = document.createElement('div');
        sep.className = 'gallery-sep';
        root.appendChild(sep);
      }
      root.appendChild(batchEl);
      offset += batchRows.length;
    });

    var lbImgs = Array.from(root.querySelectorAll('.tile img'));

    var lb = document.getElementById('lightbox');
    var lbImg = lb.querySelector('.lb-img');
    var lbClose = lb.querySelector('.lb-close');
    var lbPrev = lb.querySelector('.lb-prev');
    var lbNext = lb.querySelector('.lb-next');
    var lbCounter = lb.querySelector('.lb-counter');
    var currentIdx = 0;

    function showImg(idx) {
      currentIdx = (idx + lbImgs.length) % lbImgs.length;
      var src = lbImgs[currentIdx].dataset.full || lbImgs[currentIdx].src;
      lbImg.src = src;
      lbImg.alt = lbImgs[currentIdx].alt;
      lbCounter.textContent = (currentIdx + 1) + ' / ' + lbImgs.length;
    }

    function openLb(idx) {
      showImg(idx);
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLb() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    root.querySelectorAll('.tile').forEach(function (el) {
      el.addEventListener('click', function () {
        var img = el.querySelector('img');
        if (!img) return;
        openLb(lbImgs.indexOf(img));
      });
    });

    lbClose.addEventListener('click', closeLb);
    lbPrev.addEventListener('click', function (e) { e.stopPropagation(); showImg(currentIdx - 1); });
    lbNext.addEventListener('click', function (e) { e.stopPropagation(); showImg(currentIdx + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') showImg(currentIdx - 1);
      if (e.key === 'ArrowRight') showImg(currentIdx + 1);
    });

    var touchStartX = 0;
    lb.addEventListener('touchstart', function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) dx < 0 ? showImg(currentIdx + 1) : showImg(currentIdx - 1);
    });

    document.addEventListener('contextmenu', function (e) {
      if (e.target.closest('.collection-wrap') || e.target.closest('#lightbox')) e.preventDefault();
    });
  }

  fetch(CSV_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('CSV fetch failed: ' + res.status);
      return res.text();
    })
    .then(function (csvText) { render(parseRows(csvText)); })
    .catch(function (err) {
      console.error('The Collection: could not load content sheet.', err);
      render([]);
    });
})();
</script>

</body>
</html>
